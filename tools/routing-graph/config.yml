graphhopper:
  datareader.file: /data/highways.osm.pbf
  graph.location: /data/graph-cache
  custom_models.directory: /cfg
  profiles:
    - name: car
      custom_model_files: [truck_lite.json]
  profiles_ch:
    - profile: car
  graph.encoded_values: car_access, car_average_speed, road_class
  prepare.min_network_size: 200
  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps,bridleway,corridor,construction,residential,living_street,service,track
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
