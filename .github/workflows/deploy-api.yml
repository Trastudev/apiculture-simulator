# Despliega la API en Hetzner al subir cambios de server/ a main.
#
# Secreto del repositorio (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY — clave privada OpenSSH que entra como apiculture@178.105.199.231
#
# No sube server/.env ni firestore-key.json. Esos archivos se quedan en el servidor.
# Al arrancar, la API aplica los SQL de server/sql que aún no estén en schema_migrations.

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar que el código de la API viene en el commit
        run: test -f server/src/index.js

      - name: Preparar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Falta el secreto DEPLOY_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/apiculture_deploy
          chmod 600 ~/.ssh/apiculture_deploy
          ssh-keyscan -H 178.105.199.231 >> ~/.ssh/known_hosts

      - name: Copiar server/ y reiniciar
        run: |
          rsync -az \
            --exclude .env \
            --exclude firestore-key.json \
            --exclude node_modules \
            -e "ssh -i ~/.ssh/apiculture_deploy -o IdentitiesOnly=yes" \
            server/ apiculture@178.105.199.231:/opt/apiculture/apiculture-simulator/server/
          ssh -i ~/.ssh/apiculture_deploy -o IdentitiesOnly=yes \
            apiculture@178.105.199.231 \
            "cd /opt/apiculture/apiculture-simulator/server && npm install --omit=dev && bash start-api.sh"
